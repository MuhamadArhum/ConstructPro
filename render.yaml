services:
  # ── Backend API (Docker) ──────────────────────────────────────────────────
  - type: web
    name: constructpro-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_URLS
        value: http://+:8080
      - key: ConnectionStrings__DefaultConnection
        sync: false          # set manually in Render dashboard
      - key: Jwt__Secret
        sync: false          # set manually in Render dashboard
      - key: Jwt__Issuer
        value: BuildERP.API
      - key: Jwt__Audience
        value: BuildERP.Client
      - key: Jwt__AccessTokenExpirationMinutes
        value: "30"
      - key: Jwt__RefreshTokenExpirationDays
        value: "7"
      - key: Jwt__RememberMeRefreshTokenExpirationDays
        value: "30"
      - key: Cors__AllowedOrigins__0
        sync: false          # set to your frontend Render URL
      - key: FrontendBaseUrl
        sync: false          # set to your frontend Render URL
      - key: DefaultAdmin__Email
        value: admin@builderp.local
      - key: DefaultAdmin__Password
        sync: false          # set manually in Render dashboard

  # ── Frontend (Static Site) ────────────────────────────────────────────────
  - type: web
    name: constructpro-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    plan: free
    envVars:
      - key: VITE_API_BASE_URL
        sync: false          # set to https://constructpro-api.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
