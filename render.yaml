services:
  # ── Backend API (NestJS + Node.js) ───────────────────────────────────────
  - type: web
    name: constructpro-api
    runtime: node
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npx prisma db push --accept-data-loss && npm run build && npm run seed
    startCommand: node dist/src/main.js
    plan: free
    healthCheckPath: /api/docs
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: DATABASE_URL
        sync: false          # Set in Render dashboard — your PostgreSQL connection string
      - key: JWT_SECRET
        sync: false          # Set in Render dashboard — min 32 chars
      - key: JWT_EXPIRES_IN
        value: "8h"
      - key: JWT_REFRESH_DAYS
        value: "7"
      - key: FRONTEND_URL
        sync: false          # Set to your frontend Render URL e.g. https://constructpro.onrender.com
      - key: CORS_ORIGINS
        sync: false          # Set to your frontend Render URL e.g. https://constructpro.onrender.com
      - key: ADMIN_EMAIL
        value: admin@constructpro.com
      - key: ADMIN_PASSWORD
        sync: false          # Set in Render dashboard

  # ── Frontend (React + Vite) ───────────────────────────────────────────────
  - type: web
    name: constructpro-frontend
    env: node
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npx serve -s dist -l $PORT
    plan: free
    envVars:
      - key: VITE_API_BASE_URL
        sync: false          # Set to https://constructpro-api.onrender.com/api
      - key: PORT
        value: "3000"
